name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }} / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workboard
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: workboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workboard -d workboard_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      JWT_SECRET: ci-test-only-signing-secret-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://workboard:ci-disposable-password@localhost:5432/workboard_test
      TEST_DATABASE_URL: postgresql+psycopg://workboard:ci-disposable-password@localhost:5432/workboard_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Verify migrations and schema drift
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml

  container:
    name: Container / real HTTP workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/bootstrap.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for readiness
        run: timeout 120 bash -c 'until curl --fail --silent http://localhost:8000/health/ready; do sleep 2; done'
      - run: python3 scripts/demo.py
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --no-color api migrate db
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

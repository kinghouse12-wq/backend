name: Java CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Java 21 / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workboard
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: workboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workboard -d workboard_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/workboard_test
      TEST_DATABASE_USER: workboard
      TEST_DATABASE_PASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp spotless:check verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jacoco-report
          path: target/site/jacoco/
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-failures
          path: target/surefire-reports/
  container:
    name: Java container / HTTP workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sh scripts/bootstrap.sh
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: timeout 180 bash -c 'until curl --fail --silent http://localhost:8080/actuator/health/readiness; do sleep 2; done'
      - run: bash scripts/demo.sh
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color api db
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "workboard-api"
version = "1.0.0"
description = "A layered project and task API with ownership, audit history, and optimistic concurrency."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "pydantic[email]>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "pyjwt>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/workboard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=workboard --cov-report=term-missing --cov-fail-under=85"
markers = ["postgres: requires PostgreSQL (skipped on SQLite)"]

[tool.coverage.run]
branch = true
source = ["workboard"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

name: workboard

x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://workboard:${POSTGRES_PASSWORD:?Run scripts/bootstrap.py}@db:5432/workboard
    JWT_SECRET: ${JWT_SECRET:?Run scripts/bootstrap.py}
    TOKEN_MINUTES: ${TOKEN_MINUTES:-15}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workboard
      POSTGRES_DB: workboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workboard -d workboard"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:

spring:
  application:
    name: workboard-api
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55433/workboard}
    username: ${DATABASE_USER:workboard}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
server:
  port: ${API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt-secret: ${JWT_SECRET:}
  issuer: workboard-api
  audience: workboard-client
  token-seconds: 900
  cors-origins: []
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
